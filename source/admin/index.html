<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文章后台管理</title>
</head>
<body>
  <!-- Decap CMS（原 Netlify CMS）后台管理入口 -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script src="https://unpkg.com/decap-cms-locales@^3.0.0/dist/decap-cms-locales.js"></script>
  <script>
    // 注册中文界面（若语言包加载失败则回退英文，不影响功能）
    if (window.decapCmsLocales && window.decapCmsLocales.zh_Hans) {
      window.CMS.registerLocale('zh_Hans', window.decapCmsLocales.zh_Hans);
    }
  </script>
</body>
</html>
