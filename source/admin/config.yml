backend:
  name: github
  repo: xingzhiyou/xingzhiyou.github.io
  branch: source
  base_url: https://api.netlify.com

media_folder: "source/images"
public_folder: "/images"
locale: zh_Hans

collections:
  - name: posts
    label: 文章
    folder: source/_posts
    create: true
    slug: "{{slug}}"
    fields:
      - {label: 标题, name: title, widget: string}
      - {label: 日期, name: date, widget: datetime}
      - {label: 分类, name: categories, widget: list}
      - {label: 标签, name: tags, widget: list}
      - {label: 永久链接, name: permalink, widget: string, required: false, hint: "例如 2026/08/18/文章名/，留空则用默认格式"}
      - {label: 正文, name: body, widget: markdown}
